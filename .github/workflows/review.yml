name: PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened

permissions: {}

jobs:
  review:
    name: Review Pull Request

    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Generate GitHub App Token 
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with: 
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@41ea7642c1436fa0ee57aae58347904b71a5af27 # v1.0.137

        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api

          # Repository Variable
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.OPENROUTER_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.OPENROUTER_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ vars.OPENROUTER_MODEL }}

        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}

          track_progress: true
          allowed_bots: Copilot

          prompt: |
            リポジトリ: ${{ github.repository }}
            PR番号: ${{ github.event.pull_request.number }}

            Pull Requestをレビューしてください。

            以下の観点を重点的に確認してください。

            ## コード品質
            - クリーンコードの原則に従っているか
            - 命名は適切か
            - 可読性・保守性に問題はないか
            - 重複実装や不要な複雑さはないか

            ## セキュリティ
            - セキュリティ上の脆弱性がないか
            - 入力値検証は十分か
            - 権限管理・認可処理に問題はないか
            - 秘密情報の漏洩リスクがないか

            ## パフォーマンス
            - 不要な計算や処理がないか
            - データアクセスは効率的か
            - リソースリークの可能性はないか

            ## テスト
            - 変更内容に対するテストが存在するか
            - 重要なケースが網羅されているか
            - 回帰リスクがないか

            ## ドキュメント
            - 必要なドキュメント更新が行われているか
            - API仕様変更が反映されているか

            指摘事項は重要度を以下で分類してください。

            - Critical
            - High
            - Medium
            - Low

            問題がある場合のみインラインコメントを作成してください。

            レビュー完了時にはトップレベルコメントで概要を記載してください。

            コメントはすべて日本語で記述してください。
            問題が見つからなかった場合もレビュー結果を報告してください。

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)" --effort high
